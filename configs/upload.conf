server {
	listen 127.0.0.1:8080;

	client_max_body_size 1000000;

	error_page 404 ./404.html;

	location / {
		root ./html;
		index index.html;
		autoindex off;
		allow_methods GET;
	}

	location /upload/ {
		root html/uploads;
		upload_enable on;
		upload_path html/uploads;
		allow_methods GET POST DELETE;
	}
}