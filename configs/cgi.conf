server {
    listen 127.0.0.1:8080;
    root html;

    location / {
        root html;
        allow_methods GET;
        index index.html;
		#autoindex on;
    }

    location /cgi-bin/ {
        root html;
        allow_methods GET POST;
        cgi .py python3;
    }
}

# next time u add new script - don't forget to 'chmod +x' it!

# curl -i http://localhost:8080/cgi-bin/hello.py
# curl -i "http://localhost:8080/cgi-bin/hello.py?name=dimple" (for adding QUERY_STRING)


# curl -i -X POST -d "hello=world" http://localhost:8080/cgi-bin/stdin_reading.py