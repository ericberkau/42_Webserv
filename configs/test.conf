# =========================
# Main server
# =========================

server {

	listen localhost:8080;
	listen 127.0.0.1:8081;

	client_max_body_size 1048576;

	error_page 404 ./errors/404.html;
	error_page 500 ./errors/500.html;

	location / {

		index index.html;
		allow_methods GET;

		autoindex off;

		root ./www;

	}

	location /images {

		root ./www/images;

		autoindex on;

		allow_methods GET;

	}

	location /upload {

		root ./www/uploads;

		upload_enable on;
		upload_path ./uploads;

		allow_methods POST;

	}

	location /cgi-bin {

		root .;
		allow_methods GET POST;

		cgi .php /usr/bin/php-cgi;
		cgi .py /usr/bin/python3;

	}

	location /old-page {

		root .;
		return 301 /new-page;

	}

}

# =========================
# Second server
# =========================

server {

	listen localhost:9090;

	client_max_body_size 2048;

	error_page 403 ./errors/403.html;

	location / {

		root ./secondary;
		index home.html;

		allow_methods GET;

	}

}

