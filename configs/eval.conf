server {
	listen localhost:8080;

	root eval_testing/YoupiBanane/;
	client_max_body_size 100;

	location / {
		allow_methods GET;
		index youpi.bad_extension;
	}

	location *.bla {
		allow_methods POST;
		cgi .bla eval_testing/cgi_tester;
	}

	location /post_body {
		allow_methods POST;
	}

	location /directory {
		root eval_testing/YoupiBanane/;
		allow_methods GET;
		index youpi.bad_extension;
	}
}
