server {
	listen 127.0.0.1:8080;
	client_max_body_size 1048576;

	error_page 404 ./www/errors/404.html;
	error_page 403 ./www/errors/403.html;

	location / {
		root ./www;
		index index.html;
		allow_methods GET POST;
		autoindex off;
	}

	location /images {
		root ./www;
		allow_methods GET;
		autoindex on;
	}
}

server {
	listen 127.0.0.1:9090;
	client_max_body_size 2048;

	location / {
		root ./secondary;
		index home.html;
		allow_methods GET;
		autoindex off;
	}
}


