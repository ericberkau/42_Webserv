server {
	listen 127.0.0.1:8080;
	client_max_body_size 1048576;

	error_page 404 ./html/errors/404.html;
	error_page 403 ./html/errors/403.html;

	location / {
		root ./html;
		index index.html;
		allow_methods GET POST;
		autoindex off;
	}

	location /images {
		root ./html/images;
		allow_methods GET;
		autoindex on;
	}

    location /cgi-bin/ {
        root html/cgi-bin;
        allow_methods GET POST;
        cgi .py python3;
    }

	location /upload/ {
		root html/uploads;
		upload_enable on;
		upload_path html/uploads;
		allow_methods GET POST DELETE;
	}
}

server {
	listen 127.0.0.1:9090;
	client_max_body_size 2048;

	location / {
		root ./html2;
		index home.html;
		allow_methods GET;
		autoindex off;
	}
}
