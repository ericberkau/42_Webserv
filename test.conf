server {
	listen 127.0.0.1:8080;
	client_max_body_size 1048576;
	#potato;

	location / {
		root ./www;
		autoindex off;
	}

	location /images {
		root ./www/images;
		autoindex on;
	}
}

server {
	listen 0.0.0.0:4242;
	client_max_body_size 2048;

	location /uploads {
		root ./uploads;
		autoindex off;
	}
}